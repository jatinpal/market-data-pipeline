version: 2

sources:
  - name: raw_data
    database: market-data-pipeline-alpha
    schema: raw_data
    tables:
      - name: market_data_raw
        description: "Raw daily market data for all tickers combined"
        columns:
          - name: Date
            description: "Trading date"
          - name: Ticker
            description: "Stock ticker symbol"
          - name: Open
            description: "Opening price"
          - name: High
            description: "Highest price"
          - name: Low
            description: "Lowest price"
          - name: Close
            description: "Closing price"
          - name: Volume
            description: "Trading volume"